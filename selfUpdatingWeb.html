<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Self Updating Studio</title></head><body><style>
  :root{
    --bg:#0d0f14; --surface:#151823; --surface-2:#1b1f2e;
    --line:#262b3b; --ink:#eef1f8; --muted:#8b93a7;
    --accent:#5b8cff; --accent-2:#8f6bff; --ok:#3ddc97;
  }
  *{box-sizing:border-box}
  .studio{
    max-width:1040px;margin:0 auto;padding:28px 20px 60px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--ink);
  }
  .grid{display:grid;gap:18px}
  header.hero{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;
    background:linear-gradient(135deg,var(--surface),var(--surface-2));
    border:1px solid var(--line);border-radius:16px;padding:20px;
  }
  .hero h1{font-size:1.5rem;margin:0;letter-spacing:.3px}
  .hero p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
  .pill{
    display:inline-flex;align-items:center;gap:8px;font-size:.8rem;
    background:rgba(61,220,151,.12);color:var(--ok);
    border:1px solid rgba(61,220,151,.35);padding:6px 12px;border-radius:999px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.5)}70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
  main.panel{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;
  }
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:16px;transition:transform .18s ease,border-color .18s ease;
  }
  .card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .card .k{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.6px}
  .card .v{font-size:1.7rem;font-weight:700;margin-top:6px}
  .card .s{color:var(--muted);font-size:.8rem;margin-top:4px}
  .bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:12px}
  .bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .8s ease}
  footer.log{
    margin-top:18px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:14px;padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:.78rem;
    color:var(--muted);max-height:140px;overflow:auto;
  }
  footer.log div{padding:2px 0;border-bottom:1px dashed var(--line)}
  footer.log time{color:var(--accent)}
