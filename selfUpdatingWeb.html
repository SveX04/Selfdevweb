<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Self Updating Studio</title></head><body><style>
  :root{--bg:#0b0d10;--card:#12161c;--ink:#e8edf2;--dim:#9aa5b1;--acc:#7c5cff;--acc2:#25e0c8;--radius:14px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.55;padding:clamp(1rem,4vw,3rem)}
  .wrap{max-width:1100px;margin:0 auto}
  .hero{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:2rem}
  .brand{display:flex;align-items:center;gap:.7rem}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 rgba(124,92,255,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,92,255,.5)}70%{box-shadow:0 0 0 10px rgba(124,92,255,0)}100%{box-shadow:0 0 0 0 rgba(124,92,255,0)}}
  h1{font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:-.02em}
  .stamp{font-variant-numeric:tabular-nums;color:var(--dim);font-size:.85rem}
  .grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .card{background:var(--card);border:1px solid #1e242d;border-radius:var(--radius);padding:1.2rem;transition:transform .2s,border-color .2s}
  .card:hover{transform:translateY(-4px);border-color:var(--acc)}
  .card h2{font-size:1.05rem;margin-bottom:.4rem}
  .card p{color:var(--dim);font-size:.92rem}
  .bar{height:6px;border-radius:3px;background:#1e242d;overflow:hidden;margin-top:.8rem}
  .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width 1s ease}
  .tag{display:inline-block;margin-top:.7rem;font-size:.75rem;color:var(--acc2);border:1px solid var(--acc2);padding:.15rem .55rem;border-radius:999px}
  .foot{margin-top:2rem;text-align:center;color:var(--dim);font-size:.8rem}
</style>

<main class="wrap" aria-label="Self-updating studio">
  
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <h1>Studio — Live</h1>
    </div>
    <time class="stamp" id="stamp" datetime=""></time>
  

  <section class="grid" aria-label="Status modules">
    <article class="card" data-progress="92">
      <h2>Render Queue</h2>
      <p>Batch #4418 compiling assets.</p>
      <div class="bar"><span></span></div>
      <span class="tag">On track</span>
    </article>
    <article class="card" data-progress="64">
      <h2>Sync Engine</h2>
      <p>Replicating across 3 nodes.</p>
      <div class="bar"><span></span></div</body></html>
