<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Self Updating Studio</title></head><body><style>
  #studio { font-family: 'Segoe UI', system-ui, sans-serif; display: grid; gap: 1rem; min-height: 100vh; background: linear-gradient(135deg,#0f172a,#1e293b); color:#e2e8f0; }
  #studio header { display:flex; justify-content:space-between; align-items:center; padding:1rem 1.5rem; }
  #studio h1 { font-size:1.25rem; margin:0; font-weight:600; }
  #studio .ts { font-variant-numeric: tabular-nums; font-size:.85rem; color:#94a3b8; }
  #studio main { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; padding:0 1.5rem; }
  #studio .card { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:1.25rem; transition:transform .2s; }
  #studio .card:hover { transform:translateY(-4px); }
  #studio .card h2 { margin:0 0 .5rem; font-size:1rem; }
  #studio .val { font-size:1.75rem; font-weight:700; color:#38bdf8; }
  #studio footer { padding:1rem 1.5rem; font-size:.75rem; color:#64748b; }
  @media (max-width:600px){ #studio main{grid-template-columns:1fr;} }
</style>


  <h1>Studio</h1>
  <span class="ts" id="ts" aria-label="Last updated">—</span>


<main id="cards">
  <section class="card"><h2>Uptime</h2><div class="val" id="uptime">0s</div></section>
  <section class="card"><h2>Build</h2><div class="val" id="build">—</div></section>
  <section class="card"><h2>Status</h2><div class="val" id="status">Live</div></section>
</main>

<footer>Self-updating studio · auto-refresh</footer>

<script>
  (function(){
    var base = 1789276354222, start = Date.now();
    function pad(n){ return (n<10?'0':'')+n; }
    function tick(){
      var d = new Date(base);
      document.getElementById('ts').textContent =
        d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+
        pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
      var up = Math.floor((Date.now()-start)/1000);
      document.getElementById('uptime').textContent = up+'s';
      document.getElementById('build').textContent = 'v'+(1000+up);
    }
    tick();
    setInterval(tick, 1000);
  })();
</script></body></html>
