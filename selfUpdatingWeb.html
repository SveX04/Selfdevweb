<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Self Updating Studio</title></head><body><style>
  :root {
    --ink: #1b1e23;
    --paper: #f7f5f0;
    --accent: #2f6df6;
    --accent-soft: #e7efff;
    --grid: #e4e0d6;
  }
  .studio {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 32px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 32px 100%,
      var(--paper);
    max-width: 920px;
    margin: 0 auto;
    padding: 24px;
    line-height: 1.5;
  }
  .studio h1 {
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    align-items: center;
    font-size: 0.82rem;
    color: #5a5f68;
    margin-bottom: 18px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 600;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.7); }
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 16px;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(27,30,35,0.08);
  }
  .card h2 {
    margin: 0 0 6px;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #8a8f98;
  }
  .card .big {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--ink);
  }
  .panel {
    background: #fff;
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 18px;
  }
  .panel p { margin: 0 0 14px; color: #3b3f46; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    font: inherit;
    font-weight: 600;
    cursor: pointer;</body></html>
