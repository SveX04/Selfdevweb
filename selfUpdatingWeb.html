<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Self Updating Studio</title></head><body><style>
  :root {
    --c-bg: #0b0f19;
    --c-panel: rgba(255,255,255,0.06);
    --c-line: rgba(255,255,255,0.12);
    --c-ink: #e9eef6;
    --c-mut: #93a0b4;
    --c-accent: #6ee7ff;
    --c-accent2: #a78bfa;
    --c-glow: rgba(110,231,255,0.35);
    --r: 14px;
    --sp: 20px;
    --max: 1100px;
  }
  * { box-sizing: border-box; }
  .sds {
    max-width: var(--max);
    margin: 0 auto;
    padding: clamp(18px, 4vw, 40px);
    color: var(--c-ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.55;
  }
  .sds-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--sp);
  }
  @media (min-width: 820px) {
    .sds-grid { grid-template-columns: 1.4fr 1fr; align-items: start; }
  }
  .sds-hero {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: var(--sp);
    align-items: center;
    justify-content: space-between;
    padding: var(--sp);
    border: 1px solid var(--c-line);
    border-radius: var(--r);
    background:
      radial-gradient(120% 140% at 0% 0%, var(--c-glow), transparent 55%),
      var(--c-panel);
  }
  .sds-title {
    margin: 0;
    font-size: clamp(1.5rem, 3.5vw, 2.4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--c-accent), var(--c-accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sds-sub {
    margin: 8px 0 0;
    color: var(--c-mut);
    font-size: 0.95rem;
    max-width: 46ch;
  }
  .sds-status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border: 1px solid var(--c-line);
    border-radius: 999px;
    background: rgba(0,0,0,0.25);
    font-variant-numeric: tabular-nums;
    font-size: 0.9rem;
  }
  .sds-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--c-accent);
    box-shadow: 0 0 0 0 var(--c-glow);
    animation: sds-pulse 1.8s infinite;
  }
  @keyframes sds-pulse {
