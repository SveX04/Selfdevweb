<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Self Updating Studio</title></head><body><style>
  :root{
    --bg:#0e1116; --card:#151a22; --line:#232b37; --ink:#e8edf4;
    --muted:#8b97a8; --accent:#5eead4; --accent2:#a78bfa; --ok:#4ade80;
    --r:14px;
  }
  *{box-sizing:border-box}
  #app{
    min-height:100vh; display:grid; place-items:center;
    background:
      radial-gradient(1200px 600px at 20% -10%, #1b2436 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #14232b 0%, transparent 55%),
      var(--bg);
    color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    padding:24px;
  }
  .wrap{width:100%;max-width:760px}
  .top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .logo{
    width:46px;height:46px;border-radius:12px;flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;font-weight:800;color:#0b0e13;font-size:20px;
    box-shadow:0 8px 24px -8px rgba(94,234,212,.5);
  }
  .top h1{font-size:20px;margin:0;line-height:1.1}
  .top p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .live{
    margin-left:auto;display:flex;align-items:center;gap:7px;
    font-size:12px;color:var(--muted);
    background:var(--card);border:1px solid var(--line);
    padding:7px 12px;border-radius:999px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}
    70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}
    100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}
  }
  .grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
  .grid .full{grid-column:1/-1}
  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:18px;
    transition:transform .15s ease, border-color .15s ease;
  }
  .card:hover{transform:translateY(-2px);border-color:#33405299}
  .card h2{margin:0 0 6px;font-size:15px}
  .chip{display:inline-block;font-size:11px;color:var(--accent);
    background:rgba(94,234,212,.1);border:1px solid rgba(94,234,212,.25);
    padding:2px 8px;border-radius:999px;margin-bottom:10px}
  .stat{font-size:34px;font-weight:80</body></html>
