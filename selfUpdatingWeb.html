<style>
:root{
  --sans:"Space Grotesk", system-ui, sans-serif;
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --bg:#0c100f; --bg-1:#111716; --bg-2:#161f1d;
  --line:rgba(233,225,207,.12); --line-2:rgba(233,225,207,.06);
  --ink:#f0ebe0; --ink-dim:#b6b0a2; --ink-mute:#7c786e;
  --lime:#c8f542; --lime-2:#eaffb0; --coral:#ff6a45; --mint:#5fe0c0; --amber:#f6c24a;
  --focus:var(--lime);
  --wrap:1300px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:3px}
.wrap{width:100%;max-width:var(--wrap);margin-inline:auto;padding-inline:clamp(18px,4vw,46px)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.mono{font-family:var(--mono)}
