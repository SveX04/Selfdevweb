<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Self Updating Studio</title></head><body><style>
  :root { --bg:#0f1115; --card:#171a21; --line:#2a2f3a; --fg:#e8eaf0; --mut:#8a93a6; --acc:#57e6a3; --acc2:#7aa2ff; }
  * { box-sizing:border-box; }
  main { max-width:1100px; margin:0 auto; padding:28px 20px 64px; font:400 16px/1.55 system-ui,Segoe UI,Roboto,sans-serif; color:var(--fg); background:var(--bg); min-height:100vh; }
  header { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; justify-content:space-between; margin-bottom:26px; }
  h1 { font-size:1.7rem; margin:0; letter-spacing:.2px; }
  h1 span { color:var(--acc); }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--acc); box-shadow:0 0 0 0 rgba(87,230,163,.6); animation:pulse 2s infinite; vertical-align:middle; margin-right:8px; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(87,230,163,.5)} 70%{box-shadow:0 0 0 8px rgba(87,230,163,0)} 100%{box-shadow:0 0 0 0 rgba(87,230,163,0)} }
  .stamp { color:var(--mut); font-size:.85rem; font-variant-numeric:tabular-nums; }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; transition:transform .18s ease, border-color .18s ease; }
  .card:hover { transform:translateY(-3px); border-color:var(--acc2); }
  .card h2 { font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; color:var(--mut); margin:0 0 10px; }
  .val { font-size:1.9rem; font-weight:600; font-variant-numeric:tabular-nums; }
  .val small { font-size:.9rem; color:var(--mut); font-weight:400; }
  .bar { height:6px; border-radius:4px; background:var(--line); overflow:hidden; margin-top:12px; }
  .bar i { display:block; height:100%; width:0; border-radius:4px; background:linear-gradient(90deg,var(--acc),var(--acc2)); transition:width .6s ease; }
  .row { display:flex; flex-wrap:wrap; gap:10px; margin-top:24px; }
  button.tag { background:transparent; border:1px solid var(--line); color:var(--fg); padding:8px 14px; border-radius:999px; cursor:pointer; font:inherit; font-size:.85rem; }
  button.tag.active, button.tag:hover { border-color:var(--acc); color:var(--acc); }
  .log { margin-top:22px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; max-height:180px; overflow:auto; font:400 .8rem/1.6 ui-monospace,Menlo,Consolas,monospace; color:var(--mut); }
  .log b { color:var(--acc); font-weight:600; }</body></html>
