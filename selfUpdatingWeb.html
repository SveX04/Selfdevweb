<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Self Updating Studio</title></head><body><style>
*{box-sizing:border-box;margin:0;padding:0}
main{min-height:100vh;background:linear-gradient(160deg,#0f1117,#1a1f2e);color:#e8eaf0;font-family:system-ui,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}
nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid #ffffff10;flex-wrap:wrap;gap:.75rem}
nav .logo{font-weight:700;font-size:1.25rem;letter-spacing:.02em}
nav ul{display:flex;gap:1.5rem;list-style:none}
nav a{color:#9ca3af;text-decoration:none;font-size:.9rem;transition:color .2s}
nav a:hover,nav a[aria-current]{color:#fff}
.hero{flex:1;display:flex;align-items:center;justify-content:center;padding:4rem 2rem}
.hero h1{font-size:clamp(1.8rem,5vw,3.4rem);line-height:1.15;text-align:center;max-width:600px;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{margin-top:1rem;text-align:center;color:#9ca3af;font-size:1rem}
.feed{padding:1rem 2rem 2.5rem;display:grid;gap:.75rem;max-width:720px;margin:0 auto;width:100%}
.feed-item{background:#ffffff08;border:1px solid #ffffff10;border-radius:.5rem;padding:.75rem 1rem;display:flex;align-items:center;gap:.75rem;animation:fade .3s ease}
.feed-item time{font-size:.75rem;color:#6b7280;white-space:nowrap}
.feed-item span{font-size:.9rem}
.badge{font-size:.65rem;padding:.15rem .5rem;border-radius:99px;background:#a78bfa30;color:#c4b5fd}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){nav ul{gap:1rem}.hero{padding:2.5rem 1rem}}
</style>

<main>
  <nav>
    <span class="logo">Studio&nbsp;Live</span>
    <ul>
      <li><a href="#" aria-current="page">Home</a></li>
      <li><a href="#">Work</a></li>
      <li><a href="#">About</a></li>
    </ul>
  </nav>

  <section class="hero">
    <div>
      <h1>Self-Updating Studio</h1>
      <p>Real-time feed &middot; last sync <time id="ts" datetime=""></time></p>
    </div>
  </section>

  <section class="feed" id="feed" aria-live="polite" aria-label="Activity feed"></section>
</main>

<script>
(function(){
  var tsEl=document.getElementById('ts'),
      feed=document.getElementById('feed'),
      stamp=1789275536832,
      labels=['Deploy','Sync','Build','Commit','Preview','Audit'],
      max=8;

  function render(){
    tsEl.textContent=new Date(stamp).toLocaleString();
    tsEl.setAttribute('datetime',new Date(stamp).toISOString());
  }

  function add(){
    var i=Math.floor(Math.random()*labels.length),
        div=document.createElement('div');
    div.className='feed-item';
    div.innerHTML='<time>'+new Date().toLocaleTimeString()+'</time><span class="badge">'+labels[i]+'</span><span>'+labels[i]+' completed successfully.</span>';
    feed.prepend(div);
    while(feed.children.length>max) feed.removeChild(feed.lastChild);
  }

  render();</body></html>
