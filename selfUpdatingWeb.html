<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Self Updating Studio</title></head><body><style>
:root{--bg:#05100f;--card:#0b1a19;--line:#1e3a38;--ink:#e8f5f2;--dim:#8fb3ad;--acc:#3ddc97;--warn:#ffb454}
*{box-sizing:border-box}
main{max-width:720px;margin:0 auto;padding:24px 20px 64px;font:16px/1.55 system-ui,sans-serif;background:radial-gradient(1200px 500px at 50% -10%,#0e2b28,var(--bg));color:var(--ink);min-height:100vh}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.5)}70%{box-shadow:0 0 0 10px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
h1{font-size:1.3rem;font-weight:700;margin:0;letter-spacing:-.02em}
.badge{margin-left:auto;font-size:.72rem;color:var(--dim);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.headline{font-size:1.7rem;font-weight:800;margin:8px 0 4px;letter-spacing:-.03em}
.sub{color:var(--dim);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:linear-gradient(180deg,#0d201e,#0a1615);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.stat .v{font-size:1.5rem;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#7ff0c4);transition:width .6s ease;border-radius:999px}
.tick{display:flex;justify-content:space-between;font-size:.8rem;color:var(--dim);margin-top:14px}
ul{margin:0;padding-left:0;list-style:none}
li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
li:last-child{border:0}
li .t{color:var(--dim);font-variant-numeric:tabular-nums;flex:none;width:96px}
.tag{margin-left:auto;font-size:.7rem;padding:2px 8px;border-radius:999px;background:#123029;color:var(--acc);flex:none}
.tag.warn{background:#33240f;color:var(--warn)}
footer{color:var(--dim);font-size:.78rem;text-align:center;margin-top:28px}
@media(max-width:480px){</body></html>
