<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An autonomous studio that revisits its own page — each change proposed, checked, and shipped on a live revision ledger.">
  <title>Self-Updating Studio — revision 041</title>
  <style>
    :root{
      color-scheme: dark;
      --bg:#0d1015;
      --bg-2:#12161d;
      --panel:#171c24;
      --line:rgba(233,237,241,.12);
      --line-2:rgba(233,237,241,.24);
      --ink:#eef1f4;
      --muted:#8b95a3;
      --accent:#ff6a3d;
      --accent-2:#ffc24a;
      --ok:#5ecb8f;
      --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
      --mono:ui-monospace,"SFMono-Regular","SF Mono","Cascadia Code",Menlo,Consolas,monospace;
      --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      --wrap:min(1180px, calc(100% - 40px));
    }
    *,*::before,*::after{box-sizing:border-box}
    html{background:var(--bg);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
    body{
      margin:0;color:var(--ink);background:var(--bg);
      font-family:var(--sans);line-height:1.55;overflow-x:hidden;
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }
    ::selection{background:var(--accent);color:#0d1015}
    a{color:inherit;text-decoration:none}
    button{font:inherit;color:inherit}
    :focus-visible{outline:2px solid var(--accent-2);outline-offset:3px;border-radius:3px}

    .mono{font-family:var(--mono)}
    .accent{color:var(--accent)}
    .ok{color:var(--ok)}
    .off{color:var(--muted)}

    .app{position:relative;z-index:1}
    .wrap{width:var(--wrap);margin-inline:auto}

    /* ---------- ambient background ---------- */
    .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}

      background-image:
        linear-gradient(rgba(238,241,244,.035) 1px,transparent 1px),

      mask-image:radial-gradient(120% 80% at 50% 0%,#000 30%,transparent 92%);}
