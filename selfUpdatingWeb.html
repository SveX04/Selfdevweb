<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Self Updating Studio</title></head><body><style>
:root{--bg:#0d1117;--panel:#161b22;--accent:#58a6ff;--text:#e6edf3;--dim:#8b949e;--ok:#3fb950;--serif:ui-serif,Georgia,serif;--mono:ui-monospace,monospace;--sans:system-ui,sans-serif}
*{box-sizing:border-box}
main{max-width:1080px;margin:0 auto;padding:24px;font-family:var(--sans);color:var(--text);line-height:1.5}
.card{background:var(--panel);border:1px solid #21262d;border-radius:12px;padding:16px}
.hero{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--serif);font-size:clamp(1.6rem,4vw,2.4rem);margin:0}
.tag{color:var(--dim);font-family:var(--mono);font-size:.85rem}
.grid{display:grid;gap:16px;margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:8px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#clock{font-family:var(--mono);font-size:1.3rem;color:var(--accent)}
.h{font-family:var(--serif);font-size:1.1rem;margin:0 0 6px}
.p{color:var(--dim);margin:0;font-size:.95rem}
input{width:100%;background:var(--bg);border:1px solid #21262d;border-radius:8px;padding:10px;color:var(--text);font-family:var(--mono)}
button{margin-top:10px;width:100%;background:var(--accent);color:#0d1117;border:0;border-radius:8px;padding:10px;font-weight:600;cursor:pointer}
#log{list-style:none;margin:8px 0 0;padding:0;font-family:var(--mono);font-size:.8rem;color:var(--dim)}
#log li{padding:3px 0;border-bottom:1px dashed #21262d}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<main>
  
    <h1>The Self-Updating Studio</h1>
    <span class="tag">build <span id="ts">…</span></span>
  

  <section class="card grid">
    <div>
      <p class="h"><span class="dot" aria-hidden="true"></span>Live Clock</p>
      <div id="clock" aria-live="polite">--:--:--</div>
      <p class="p">Syncs to your local time, always.</p>
    </div>
    <div>
      <h2 class="h">Status</h2>
      <p class="p">Pipeline healthy · last heartbeat <span id="hb">now</span></p>
    </div>
    <div>
      <h2 class="h">Quick Update</h2>
      <label for="q" class="p">Enter a note to log</label>
      <input id="q" type="text" placeholder="e.g. deployed v2.3" aria-label="Update note">
      <button type="button" id="go">Commit</button>
      <ul id="log" aria-live="polite"></ul>
    </div>
  </section>
</main>
<script>
