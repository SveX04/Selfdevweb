<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Self Updating Studio</title></head><body><style>
  :root{
    --bg:#0d1117;
    --bg-2:#131a24;
    --panel:#171f2b;
    --line:#263242;
    --ink:#e8eef6;
    --muted:#93a3b8;
    --faint:#5a6b80;
    --accent:#c9a24b;
    --accent-2:#39d2c0;
    --accent-3:#7aa2ff;
    --glow:#c9a24b33;
  }
  .studio{
    --t:0;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 80% -10%, #1b2740 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #10202b 0%, transparent 55%),
      var(--bg);
    min-height:100vh;
    position:relative;
    overflow:hidden;
  }
  .studio .grain{
    position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.05;
    background-image:radial-gradient(#fff 1px,transparent 1px);
    background-size:4px 4px;
    mix-blend-mode:overlay;
  }
  .studio .wrap{
    position:relative;z-index:1;
    max-width:1180px;margin:0 auto;padding:clamp(20px,4vw,48px);
  }
  /* Top bar */
  .studio .bar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    flex-wrap:wrap;margin-bottom:clamp(28px,5vw,56px);
  }
  .studio .brand{display:flex;align-items:center;gap:12px}
  .studio .mark{
    width:38px;height:38px;border-radius:10px;
    background:conic-gradient(from 0deg,#c9a24b,#39d2c0,#7aa2ff,#c9a24b);
    animation:spin 14s linear infinite;
    box-shadow:0 0 24px var(--glow);
  }
  .studio .brand h1{font-size:1.15rem;margin:0;letter-spacing:.02em;font-weight:600}
  .studio .brand small{color:var(--faint);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
  .studio .stat{
    display:flex;align-items:center;gap:10px;
    background:var(--panel);border:1px solid var(--line);
    padding:8px 14px;border-radius:999px;font-size:.8rem;color:var(--muted);
  }
  .studio .dot{width:8px;height:8px;border-radius:50%;background:var(--accent-2);
    box-shadow:0 0 10px var(--accent-2);animation:pulse 1.6s ease-in-out infinite}
  .studio .ts{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}

  /* Hero */
  .studio .hero{margin-bottom:clamp(32px,5vw,64px)}
  .studio .hero .kicker{
    color:var(--accent);font-size:.8rem;letter-spacing:.28em;text-transform:uppercase;
    margin:0 0 14px;
  }
  .studio .hero h2{
    margin:0 0 18px;font-size:clamp(2rem,6vw,3.6rem);line-height:1.05;font-weight:700</body></html>
