<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Self Updating Studio</title></head><body><style>
  :root { --bg:#0f1115; --panel:#171a20; --ink:#e8eaf0; --muted:#9aa3b2; --accent:#6ee7b7; --accent2:#f59e0b; }
  * { box-sizing:border-box; }
  main { font-family: system-ui, sans-serif; color:var(--ink); background:var(--bg); min-height:100vh; padding:16px; }
  .wrap { max-width:900px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  h1 { font-size:1.35rem; margin:0; }
  .clock { display:flex; gap:8px; align-items:center; font-variant-numeric:tabular-nums; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid #23272f; border-radius:12px; padding:16px; }
  .card h2 { font-size:1rem; margin:0 0 8px; }
  .bar { height:8px; background:#23272f; border-radius:4px; overflow:hidden; margin-top:10px; }
  .bar > span { display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .6s ease; }
  .stat { font-size:2rem; font-weight:700; color:var(--accent); }
  .muted { color:var(--muted); font-size:.85rem; }
  .pulse { animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  @media (max-width:520px){ .grid{grid-template-columns:1fr} }
</style>
<main>
  <div class="wrap">
    
      <div>
        <h1>Self-Updating Studio</h1>
        <p class="muted" style="margin:4px 0 0">Live render · build <span id="build">—</span></p>
      </div>
      <div class="clock" role="status" aria-live="polite">
        <span class="dot pulse" aria-hidden="true"></span>
        <time id="clock">—</time>
      </div>
    
    <div class="grid">
      <section class="card" aria-labelledby="s1">
        <h2 id="s1">Pipeline</h2>
        <p class="muted">Deployment health</p>
        <div class="bar"><span id="bar" style="width:0%"></span></div>
        <p class="muted" id="pct" aria-live="polite">0%</p>
      </section>
      <section class="card" aria-labelledby="s2">
        <h2 id="s2">Updates</h2>
        <p class="stat" id="count">0</p>
        <p class="muted">applied this session</p>
      </section>
      <section class="card" aria-labelledby="s3">
        <h2 id="s3">Last Sync</h2>
        <p class="stat" id="latency">0</p>
        <p class="muted">ms round-trip</p>
      </section>
    </div>
  </div>
</main>
<script>

  var base = 178</body></html>
